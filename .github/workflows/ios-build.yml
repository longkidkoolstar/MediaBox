name: Build iOS IPA

on:
  push:
    tags:
      - 'v*' # Triggers only when you push a tag that starts with 'v' (e.g., v1.0.0)

permissions:
  contents: write # Required for creating releases

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS App (Unsigned)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR=$(pwd)/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/App.app Payload/
          zip -qr MediaBox.ipa Payload
          
      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        with:
          # Automatically uses the pushed tag for the release name
          files: MediaBox.ipa
          generate_release_notes: true
